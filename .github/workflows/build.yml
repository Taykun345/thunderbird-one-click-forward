name: Build XPI

# Every push / PR builds the .xpi (downloadable from the run's artifacts).
# Pushing a tag vX.Y also publishes a GitHub Release with the .xpi attached;
# the tag must match "version" in manifest.json.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version v$version"
            exit 1
          fi

      - name: Build
        run: bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: xpi
          path: '*.xpi'

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.xpi --title "$GITHUB_REF_NAME" --generate-notes
