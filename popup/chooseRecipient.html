<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Choose Recipient</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 4px;
      font-size: 9pt;
    }
    button {
      margin: 0;
      display: block;
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
      padding: 4px 8px;
      border: 1px solid #d0d0d0;
      border-radius: 4px;
      background: white;
      cursor: pointer;
      margin-bottom: 2px;
    }
    button:hover {
      background: #e8f0fe;
      border-color: #1a56db;
    }
    #error { color: red; }
    #error span.red { display: none; }
    #error[data-view="red"] span.red { display: revert; }
    p { margin: 4px 0; font-size: 11px; color: #888; }
  </style>
</head>
<body>
  <div id="configs"></div>
  <p id="shiftInstruction">Hold Shift to open compose window instead of sending directly.</p>
  <div id="error" data-view="none">
    <span class="red"></span>
  </div>
  <script src="../utils.js"></script>
  <script src="chooseRecipient.js"></script>
</body>
</html>
